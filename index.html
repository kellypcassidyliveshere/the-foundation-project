<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber & Juice Bar</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0 0 75px 0;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .neon-yellow {
            color: #ccff00;
            text-shadow: 0 0 10px rgba(204, 255, 0, 0.7);
        }
        .neon-pink {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.7);
        }
        .neon-cyan {
            color: #00ffff;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
            display: block;
            margin: 5px 0;
        }

        /* Stock Image under Title */
        .header-stock-img {
            width: 90%;
            max-width: 400px;
            height: auto;
            border-radius: 12px;
            border: 1px solid #ff00ff;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
            margin: 0 auto 20px auto;
            display: block;
            object-fit: cover;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            margin: 0 20px 20px 20px;
        }
        .tab {
            width: 50%;
            padding-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .tab.active {
            color: #00ffff;
            border-bottom: 3px solid #00ffff;
        }

        /* Content Sections */
        .tab-content {
            display: none;
            padding: 0 20px 30px 20px;
        }
        .tab-content.active {
            display: block;
        }

        /* Outlined Banners / Buttons */
        .outline-banner {
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 15px;
            color: #ff00ff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            cursor: pointer;
            background: transparent;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .outline-banner.white-text {
            color: #ffffff;
            font-weight: normal;
        }

        /* Manual Horizontal Scrolling Drink Menu */
        .drink-scroll-container {
            overflow-x: auto;
            width: 100%;
            background: #111;
            padding: 15px 10px;
            white-space: nowrap;
            position: relative;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .drink-scroll-container::-webkit-scrollbar {
            display: none;
        }
        .drink-scroll-track {
            display: flex;
            width: max-content;
            gap: 15px;
        }
        .drink-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            cursor: pointer;
        }
        .drink-item img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid #ff00ff;
            background: #1a1a1a;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.4);
            transition: transform 0.2s;
        }
        .drink-item img:hover {
            transform: scale(1.05);
            border-color: #00ffff;
        }
        .drink-item.selected img {
            border-color: #00ff00 !important;
            box-shadow: 0 0 15px #00ff00 !important;
        }
        .drink-label {
            font-size: 12px;
            color: #fff;
            margin-top: 6px;
            font-weight: bold;
        }

        /* Pods Tab Elements */
        .pod-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }
        .pod-checkbox {
            width: 45px;
            height: 45px;
            border: 2px solid #0088ff;
            color: #0088ff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 136, 255, 0.4);
            transition: all 0.2s ease;
        }
        .pod-checkbox.selected {
            border-color: #00ff00;
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .cyber-input {
            width: 100%;
            background-color: #111;
            border: 1px solid #0088ff;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }
        .cyber-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        /* Fixed Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #151520;
            padding: 10px 15px;
            font-size: 11px;
            color: #cccccc;
            line-height: 1.4;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .footer a {
            color: #ffcc00;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <h1>
        <span class="neon-yellow">CYBER LOUNGE</span>
        <span class="neon-cyan">&</span>
        <span class="neon-pink">JUICE BAR</span>
    </h1>

    <!-- Stock Image Added Under Title -->
    <img src="juicestock.png" alt="Juice Stock" class="header-stock-img">

    <!-- Tabs Navigation -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('drinks')">DRINKS</div>
        <div class="tab" onclick="switchTab('pods')">PODS</div>
    </div>

    <!-- ================= DRINKS TAB ================= -->
    <div id="drinks-tab" class="tab-content active">
        
        <div class="outline-banner">CHOOSE YOUR FLAVOUR</div>

        <!-- Manual Horizontal Scrolling Drink Menu Container -->
        <div class="drink-scroll-container">
            <div class="drink-scroll-track" id="drinkTrack">
                <div class="drink-item" onclick="selectAndProceed('Kaleb Moon', 7, 'kalebmoon.jpg')">
                    <img src="kalebmoon.jpg" alt="Kaleb Moon">
                    <div class="drink-label">Kaleb Moon</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Maia Gold', 7, 'maiagold.jpg')">
                    <img src="maiagold.jpg" alt="Maia Gold">
                    <div class="drink-label">Maia Gold</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Kiwi Crisp', 7, 'kiwicrisp.jpg')">
                    <img src="kiwicrisp.jpg" alt="Kiwi Crisp">
                    <div class="drink-label">Kiwi Crisp</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Lime Rush', 7, 'limerush.jpg')">
                    <img src="limerush.jpg" alt="Lime Rush">
                    <div class="drink-label">Lime Rush</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Cool Melon Rush', 7, 'coolmelonrush.jpg')">
                    <img src="coolmelonrush.jpg" alt="Cool Melon Rush">
                    <div class="drink-label">Cool Melon</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Dragonberry Dream', 7, 'dragonberrydream.jpg')">
                    <img src="dragonberrydream.jpg" alt="Dragonberry Dream">
                    <div class="drink-label">Dragonberry</div>
                </div>
                <div class="drink-item" onclick="selectAndProceed('Berry Choc Whirl', 7, 'berrychocwhirl.jpg')">
                    <img src="berrychocwhirl.jpg" alt="Berry Choc Whirl">
                    <div class="drink-label">Berry Choc</div>
                </div>
            </div>
        </div>

<a href="signup.html" class="outline-banner white-text">JOIN OUR COMMUNITY</a>
    </div>

    <!-- ================= PODS TAB ================= -->
    <div id="pods-tab" class="tab-content">
        
        <div class="outline-banner">SELECT YOUR POD</div>

        <!-- 14 Checkboxes generated by JS -->
        <div class="pod-grid" id="podGrid"></div>

        <div class="form-group">
            <label>Choose Date:</label>
            <input type="date" id="bookingDate" class="cyber-input">
        </div>

        <div class="form-group">
            <label>Select Time:</label>
            <select id="bookingTime" class="cyber-input">
                <option value="" disabled selected>Select a time...</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="1:00 PM">1:00 PM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="3:00 PM">3:00 PM</option>
                <option value="4:00 PM">4:00 PM</option>
                <option value="5:00 PM">5:00 PM</option>
                <option value="6:00 PM">6:00 PM</option>
                <option value="7:00 PM">7:00 PM</option>
                <option value="8:00 PM">8:00 PM</option>
                <option value="9:00 PM">9:00 PM</option>
                <option value="10:00 PM">10:00 PM</option>
                <option value="11:00 PM">11:00 PM</option>
            </select>
        </div>

        <button class="outline-banner white-text" onclick="confirmBooking()">CONFIRM BOOKING</button>
    </div>

    <!-- Fixed Footer -->
    <div class="footer">
        Every sip creates change. We allocate 10% of all profits to fund<br>
        <a href="https://thefoundationproject.online" target="_blank">thefoundationproject.online</a>
    </div>

    <script>
        let selectedPodNum = null;

        // Initialize today's date in the date picker
        document.getElementById('bookingDate').valueAsDate = new Date();

        // Generate the 14 Pod Checkboxes
        const podGrid = document.getElementById('podGrid');
        for (let i = 1; i <= 14; i++) {
            let podBox = document.createElement('div');
            podBox.className = 'pod-checkbox';
            podBox.innerText = i;
            podBox.onclick = function() { selectPod(i, this); };
            podGrid.appendChild(podBox);
        }

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if(tabId === 'drinks') {
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
            }

            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabId + '-tab').classList.add('active');
            window.scrollTo(0, 0);
        }

        // Instant Drink Selection: Pass drink details and price directly to addboosters.html
        function selectAndProceed(name, price, img) {
            const params = new URLSearchParams({
                drink: name,
                price: price,
                image: img
            });
            window.location.href = `addboosters.html?${params.toString()}`;
        }

        // Pod Selection Logic
        function selectPod(num, element) {
            document.querySelectorAll('.pod-checkbox').forEach(box => box.classList.remove('selected'));
            element.classList.add('selected');
            selectedPodNum = num;
        }

        // Confirm Booking Logic for Pods tab
        function confirmBooking() {
            if (!selectedPodNum) {
                alert("Please select a Pod (1-14).");
                return;
            }
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            if (!time) {
                alert("Please select a time.");
                return;
            }

            alert(`Booking confirmed for Pod ${selectedPodNum} on ${date} at ${time}!`);
        }
    </script>
</body>
</html>
